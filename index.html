<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2f2f2">
    <title>Entrar — Contactos</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="login">
    <main class="app">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="Contactos, início">
          <span class="brand-icon" aria-hidden="true">c</span>
          <span>contactos</span>
        </a>
      </header>

      <section class="intro login-intro" aria-labelledby="login-intro-label">
        <p class="eyebrow" id="login-intro-label">BEM-VINDO/A</p>
      </section>

      <section class="auth-panel" aria-label="Acesso à conta">
        <form id="login-form" class="auth-form">
          <label for="login-identifier">Nome ou email</label>
          <input id="login-identifier" name="identifier" type="text" autocomplete="username" maxlength="254" placeholder="O seu nome ou email" required>
          <label for="login-password">Palavra-passe</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="A sua palavra-passe" required>
          <button class="save-button" type="submit">Entrar</button>
          <p class="form-hint">Utilizadores entram com o nome; administradores, com o email. O acesso correto abre automaticamente.</p>
        </form>
        <p class="notice" id="auth-notice" role="status" hidden></p>
        <p class="form-error" id="auth-error" role="alert" hidden></p>
      </section>

      <footer class="footer">
        <span>Simples assim.</span>
      </footer>
    </main>
    <script src="supabase-config.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
