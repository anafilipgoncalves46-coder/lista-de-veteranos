<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2f2f2">
    <title>Contactos — Utilizador</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="user">
    <main class="app">
      <header class="topbar">
        <a class="brand" href="user.html" aria-label="Contactos, início">
          <span class="brand-icon" aria-hidden="true">c</span>
          <span>contactos</span>
        </a>
        <div class="header-actions">
          <span class="topbar-label" id="account-name"></span>
          <span class="role-badge">Utilizador</span>
          <button class="text-button" id="sign-out" type="button">Sair</button>
        </div>
      </header>

      <section class="contacts-panel" aria-labelledby="contacts-title">
        <div class="section-heading">
          <div>
            <h2 id="contacts-title">Os contactos</h2>
            <p id="contact-count" class="contact-count">A carregar…</p>
          </div>
        </div>
        <label class="search-box" for="search">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
          <input id="search" type="search" placeholder="Procurar por nome ou número" autocomplete="off">
        </label>
        <div class="contact-list" id="contact-list" aria-live="polite"></div>
        <div class="empty-state" id="empty-state" hidden>
          <span class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="8"></circle><path d="M9 41c1-8 7-13 15-13s14 5 15 13"></path></svg>
          </span>
          <h3>A lista ainda está vazia</h3>
          <p>Quando o administrador adicionar contactos, estes aparecerão aqui.</p>
        </div>
        <p class="no-results" id="no-results" hidden>Não encontrámos contactos com essa pesquisa.</p>
        <p class="notice" id="page-notice" role="status" hidden></p>
        <p class="form-error" id="page-error" role="alert" hidden></p>
      </section>

      <footer class="footer">
        <span><span class="status-dot" aria-hidden="true"></span> Histórico associado à sua conta</span>
        <span>Simples assim.</span>
      </footer>
    </main>
    <script src="supabase-config.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
